<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="16"
   height="16"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg">
  <defs id="defs1" />
  <!-- Terrain image frame -->
  <rect
     x="1.5" y="1.5" width="13" height="9"
     rx="1" ry="1"
     fill="none"
     stroke="#cccccc"
     stroke-width="1"
     id="frame" />
  <!-- Mountain silhouette inside frame -->
  <path
     d="M 2.5,9.5 L 5.5,5 L 8,7.5 L 10.5,4.5 L 13.5,9.5 Z"
     fill="#888888"
     id="mountain" />
  <!-- Export arrow shaft -->
  <line
     x1="8" y1="11.5" x2="8" y2="14.5"
     stroke="#cccccc"
     stroke-width="1.5"
     stroke-linecap="round"
     id="shaft" />
  <!-- Export arrow head -->
  <path
     d="M 5.5,12.5 L 8,15.5 L 10.5,12.5"
     fill="none"
     stroke="#cccccc"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="arrowhead" />
</svg>
